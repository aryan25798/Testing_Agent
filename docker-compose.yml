version: '3.8'

services:
  testing-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testing-agent-platform
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=sqlite:////app/testing_platform.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"   # FastAPI Backend & Swagger UI
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped
